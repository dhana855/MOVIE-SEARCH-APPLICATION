{% extends 'base.html' %}
{% load static %}

{% block content %}

<h1 class="section-title">🎬 Movies</h1>

<div class="movie-grid">

{% for movie in movies %}

<div class="movie-card">

    <div class="poster">

        {% if movie.poster %}
            <img src="{{ movie.poster.url }}" alt="{{ movie.title }}">
        {% else %}
            <img src="{% static 'image/movie1.jpg' %}" alt="Movie">
        {% endif %}

        <span class="rating">⭐ {{ movie.rating }}</span>

    </div>

    <div class="movie-info">

        <h3>{{ movie.title }}</h3>

        <p>{{ movie.category }}</p>

        <a href="{% url 'details' movie.id %}" class="details-btn">
            View Details
        </a>

    </div>

</div>

{% empty %}

<h2>No Movies Available</h2>

{% endfor %}

</div>

{% endblock %}
