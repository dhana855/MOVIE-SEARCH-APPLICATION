{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieVerse</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <span class="logo-icon">🎬</span>

            <h1>MovieVerse</h1>

        </div>

        <nav class="sidebar-nav">

            <a href="{% url 'home' %}">
                <span>🏠</span>
                <span>Home</span>
            </a>

            <a href="{% url 'movies' %}">
                <span>🎬</span>
                <span>Movies</span>
            </a>

            <a href="{% url 'series' %}">
                <span>📺</span>
                <span>Series</span>
            </a>

            <a href="{% url 'trending' %}">
                <span>🔥</span>
                <span>Trending</span>
            </a>

            <a href="{% url 'toprated' %}">
                <span>⭐</span>
                <span>Top Rated</span>
            </a>

            <a href="{% url 'watchlist' %}">
                <span>❤️</span>
                <span>Watchlist</span>
            </a>

            <a href="{% url 'settings' %}">
                <span>⚙️</span>
                <span>Settings</span>
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="content">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
