{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

</head>

<body>

<div class="overlay">

    <div class="auth-box">

        <h1>Create Account</h1>

        <!-- MESSAGE START -->

        {% if messages %}

            {% for message in messages %}

                <p style="color:#00ff99;text-align:center;">

                    {{ message }}

                </p>

            {% endfor %}

        {% endif %}

        <!-- MESSAGE END -->

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button class="auth-btn">

                Create Account

            </button>

        </form>

        <div class="link">

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </div>

    </div>

</div>

</body>

</html>
